name: Verify VerdantVice

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release candidate guards
        run: node --test scripts/publish-release-candidate.test.mjs

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test real SQLite and verify distributable archives
        shell: pwsh
        run: |
          if ($IsWindows) { .\gradlew.bat clean build --no-configuration-cache }
          else { bash ./gradlew clean build --no-configuration-cache }
          exit $LASTEXITCODE
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
      - name: Preserve verified release files
        if: matrix.os == 'ubuntu-latest' && matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: VerdantVice
          path: |
            verdantvice-paper/build/libs/VerdantVice-1.0.0.jar
            verdantvice-paper/build/resource-packs/*.zip

  network-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify MySQL and MariaDB with disposable Testcontainers
        run: bash ./gradlew :verdantvice-paper:networkDatabaseTest --no-configuration-cache
      - name: Preserve network database reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-database-reports
          path: |
            verdantvice-paper/build/reports/tests/networkDatabaseTest/
            verdantvice-paper/build/test-results/networkDatabaseTest/
