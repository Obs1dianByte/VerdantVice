meta:
  locale: "en_US"
  language-name: "English (US)"
  revision: "1"

prefix: "<dark_green><bold>VerdantVice</bold></dark_green> <dark_gray>»</dark_gray>"

common:
  enabled: "<green>Enabled</green>"
  disabled: "<red>Disabled</red>"
  yes: "<green>Yes</green>"
  no: "<red>No</red>"
  none: "<gray>None</gray>"
  unknown: "<gray>Unknown</gray>"
  not-applicable: "<gray>Not applicable</gray>"
  loading: "<yellow>Loading…</yellow>"
  calculating: "<yellow>Calculating…</yellow>"
  level: "<gray>Level:</gray> <white><level></white>"
  amount: "<gray>Amount:</gray> <white><amount></white>"
  price: "<gray>Price:</gray> <white><price></white>"
  owner: "<gray>Owner:</gray> <white><owner></white>"
  status: "<gray>Status:</gray> <white><status></white>"
  duration: "<gray>Duration:</gray> <white><duration></white>"
  page: "<gray>Page <page>/<pages></gray>"
  seconds: "<seconds>s"
  minutes: "<minutes> min"
  emeralds: "<amount> emeralds"
  confirm: "<green>Confirm</green>"
  cancel: "<red>Cancel</red>"
  close: "<red>Close</red>"
  back: "<yellow>Back</yellow>"
  next-page: "<green>Next page</green>"
  previous-page: "<yellow>Previous page</yellow>"
  refresh: "<aqua>Refresh</aqua>"
  search: "<aqua>Search</aqua>"
  sort: "<aqua>Sort</aqua>"

errors:
  no-permission: "<red>You do not have permission to do that.</red>"
  player-only: "<red>This action is available only to a player.</red>"
  console-only: "<red>This action is available only from the console.</red>"
  invalid-usage: "<red>Invalid usage.</red> <gray>Try:</gray> <white><usage></white>"
  invalid-number: "<red><value> is not a valid number.</red>"
  invalid-uuid: "<red><value> is not a valid UUID.</red>"
  invalid-player: "<red>Player <player> could not be found.</red>"
  player-offline: "<red>Player <player> is offline.</red>"
  invalid-locale: "<red>Unsupported language: <locale>.</red>"
  not-ready: "<yellow>VerdantVice is still starting. Please try again shortly.</yellow>"
  shutting-down: "<red>VerdantVice is shutting down; new actions are temporarily blocked.</red>"
  database-unavailable: "<red>The database is unavailable. No items were changed.</red>"
  database-conflict: "<yellow>The data changed during this action. Open the menu again and retry.</yellow>"
  internal: "<red>An unexpected error occurred.</red> <gray>Reference: <error_id></gray>"
  cooldown: "<yellow>Wait <time> before using this again.</yellow>"
  busy: "<yellow>This object is already being used by someone else.</yellow>"
  canceled: "<yellow>The action was canceled.</yellow>"
  inventory-full: "<red>Your inventory is full. The result was placed in pending deliveries.</red>"
  world-unavailable: "<red>The required world is not currently available.</red>"
  chunk-unavailable: "<red>This area is not loaded. Move closer and try again.</red>"
  target-not-found: "<red>No valid target was found.</red>"
  invalid-item: "<red>This is not a valid VerdantVice item.</red>"
  invalid-signature: "<red>This item failed authenticity verification and was quarantined.</red>"
  duplicate-item: "<red>This item identifier has already been used. The duplicate was rejected.</red>"
  item-locked: "<yellow>This item is reserved by another process.</yellow>"
  wrong-owner: "<red>You are not the owner of this item.</red>"
  wrong-item-state: "<red>This item cannot be used at its current processing stage.</red>"
  insufficient-items: "<red>You do not have all required items.</red>"
  insufficient-emeralds: "<red>You need <amount> more emeralds.</red>"
  limit-reached: "<red>You have reached the limit of <limit>.</red>"
  invalid-name: "<red>That name is not allowed. Use 3–24 appropriate characters.</red>"
  protected-region: "<red>You cannot use VerdantVice equipment in this protected area.</red>"
  farm-permission: "<red>Your farm role does not allow this action.</red>"
  farm-region-overlap: "<red>The farm cannot be created because the selected region overlaps another farm.</red>"
  manager-table-blocked: "<red>The manager table location is occupied.</red>"
  manager-table-outside-farm: "<red>The manager table must be inside the farm.</red>"
  farm-region-too-large: "<red>The selected farm region is too large.</red>"
  farm-name-required: "<red>Enter a farm name.</red>"
  configuration-invalid: "<red>Configuration <file> is invalid. The previous safe values remain active.</red>"
  restart-required: "<yellow>This setting requires a server restart.</yellow>"
  unsafe-reload: "<red>This part cannot be reloaded safely. Restart the server instead.</red>"
  operation-expired: "<yellow>This operation expired and its reserved items were returned.</yellow>"
  strong-effect-active: "<red>You cannot use another strong product while the current effect is active.</red>"
  no-space: "<red>There is not enough clear space here.</red>"
  too-far: "<red>You are too far away.</red>"

success:
  reload: "<green>Reloaded safe configuration, translations, and catalogs.</green>"
  save: "<green>Queued all dirty data for saving.</green>"
  language: "<green>Your language is now <language>.</green>"
  item-given: "<green>Gave <amount> × <item> to <player>.</green>"
  seed-given: "<green>Gave a <strain> seed to <player>.</green>"
  plant-created: "<green>Plant <plant_id> was created.</green>"
  plant-removed: "<green>Plant <plant_id> was safely removed.</green>"
  stage-set: "<green>Plant stage set to <stage>.</green>"
  quality-set: "<green>Batch quality set to <quality>.</green>"
  herbalist-spawned: "<green>Herbalist <herbalist> was created.</green>"
  worker-hired: "<green><worker> joined farm <farm>.</green>"
  farm-created: "<green>Farm <farm> was created.</green>"
  farm-deleted: "<green>Farm <farm> was safely deleted.</green>"
  invitation-sent: "<green>Invitation sent to <player>.</green>"
  member-removed: "<green><player> was removed from the farm.</green>"
  notification-settings: "<green>Notification preferences updated.</green>"
  resourcepack-sent: "<green>Resource pack request sent.</green>"
  database-migrated: "<green>Database migrations completed at version <version>.</green>"
  debug-created: "<green>Diagnostic report created: <path></green>"
  player-reset: "<green>VerdantVice data for <player> was reset.</green>"
  contract-created: "<green>Contract <contract_id> was created.</green>"
  market-updated: "<green>Market state updated.</green>"

commands:
  root:
    description: "Open VerdantVice or display command help."
    usage: "/vv [subcommand]"
  help:
    description: "Show commands available to you."
    usage: "/vv help [page]"
  guide:
    description: "Open the game guide."
    usage: "/vv guide"
  profile:
    description: "View your VerdantVice profile."
    usage: "/vv profile [player]"
  skills:
    description: "Open your four skill trees."
    usage: "/vv skills"
  strains:
    description: "Browse discovered fictional strains."
    usage: "/vv strains [strain]"
  recipes:
    description: "View unlocked processing recipes."
    usage: "/vv recipes"
  market:
    description: "View current demand and prices."
    usage: "/vv market [strain]"
  contracts:
    description: "Open your contracts."
    usage: "/vv contracts"
  farm:
    description: "Open farm management."
    usage: "/vv farm"
    create:
      description: "Create a farm from your selected region."
      usage: "/vv farm create <name>"
    delete:
      description: "Safely delete your farm after confirmation."
      usage: "/vv farm delete <name>"
    invite:
      description: "Invite a player to your farm."
      usage: "/vv farm invite <player>"
    remove:
      description: "Remove a member from your farm."
      usage: "/vv farm remove <player>"
  workers:
    description: "Open worker management."
    usage: "/vv workers"
  language:
    description: "Choose a supported language."
    usage: "/vv language <pl_PL|en_US|de_DE|es_ES|cs_CZ|uk_UA>"
  notifications:
    description: "Configure notification channels and topics."
    usage: "/vv notifications"
  resourcepack:
    description: "Request the optional VerdantVice resource pack."
    usage: "/vv resourcepack"
  genetics: { description: "Creates a custom line from two signed seeds.", usage: "/vv genetics <name>" }
  admin:
    description: "VerdantVice administration tools."
    usage: "/vv admin <subcommand>"
    reload:
      description: "Reload safe settings and catalogs."
      usage: "/vv admin reload"
    save:
      description: "Flush queued data."
      usage: "/vv admin save"
    give:
      description: "Give a registered custom item."
      usage: "/vv admin give <player> <item> [amount]"
    seed:
      description: "Give a signed seed with generated genetics."
      usage: "/vv admin seed <player> <strain> [grade]"
    plant:
      description: "Create a plant at the targeted station."
      usage: "/vv admin plant <strain>"
    setstage:
      description: "Change the targeted plant stage."
      usage: "/vv admin setstage <stage>"
    setquality:
      description: "Change the held batch quality."
      usage: "/vv admin setquality <grade>"
    spawnherbalist:
      description: "Spawn a registered herbalist."
      usage: "/vv admin spawnherbalist [tier]"
    hireworker:
      description: "Hire the targeted herbalist for a farm."
      usage: "/vv admin hireworker <farm>"
    removeplant:
      description: "Safely remove the targeted plant."
      usage: "/vv admin removeplant"
    inspect:
      description: "Inspect a VerdantVice object and its registry state."
      usage: "/vv admin inspect"
    market:
      description: "Inspect or modify a market quote/event."
      usage: "/vv admin market <show|set|event> ..."
    contract:
      description: "Create or inspect a contract."
      usage: "/vv admin contract <create|inspect> ..."
    resetplayer:
      description: "Reset a player's VerdantVice data after confirmation."
      usage: "/vv admin resetplayer <player> confirm"
    migrate:
      description: "Run pending database migrations."
      usage: "/vv admin migrate"
    database:
      description: "Show database health and queue information."
      usage: "/vv admin database"
    debug:
      description: "Create a redacted diagnostic report."
      usage: "/vv admin debug"
    performance:
      description: "Show scheduler, cache, and queue metrics."
      usage: "/vv admin performance"

