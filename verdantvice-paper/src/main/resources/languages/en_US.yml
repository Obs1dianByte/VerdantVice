book:
  basics:
    title: "VerdantVice Basics"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Getting Seeds</bold></dark_green><newline><newline>Find an evaluated Farmer herbalist and open the Verdant trade menu. Basic seeds are offered first; higher herbalist tiers unlock rarer fictional strains. Every seed has a signed, unique genetic profile."
    page_2: "<dark_green><bold>2. Planting</bold></dark_green><newline><newline>Place a Cultivation Pot where you have build and farm permission. Hold a valid seed and interact with the empty station. Farm limits, spacing, ownership, and external region protection are checked before planting."
    page_3: "<dark_green><bold>3. Inspecting</bold></dark_green><newline><newline>Use an empty hand for a simple summary or a Plant Scanner for details. Higher Grower levels and guide books reveal exact health, hydration, stress, harvest windows, and genetics."
    page_4: "<dark_green><bold>4. Watering</bold></dark_green><newline><newline>Use a Watering Can when hydration falls. Water is a fictional game meter: too little slows growth, while repeated use above the preferred range can create Overwatering."
    page_5: "<dark_green><bold>5. Solving Problems</bold></dark_green><newline><newline>Inspect the listed condition, then use the matching Cleaning Kit, Treatment Spray, Nutrient Pack, or Repair Kit. Problems lower potential gradually; they do not destroy a healthy plant instantly."
    page_6: "<dark_green><bold>6. Harvesting</bold></dark_green><newline><newline>Harvest timing ranges from Too Early to Overripe. The highlighted window offers the best weight and quality. Harvesting creates one registered batch with a permanent origin and signature."
    page_7: "<dark_green><bold>7. Drying</bold></dark_green><newline><newline>Open a clean Drying Rack and load a fresh batch. The batch is stored safely by the plugin and advances by timestamps. Remove it near Ready; waiting too long can produce Overdried or Ruined results. The normal sale path is: harvest → fresh batch → Drying Rack → dry batch → herbalist sale."
    page_8: "<dark_green><bold>8. Curing</bold></dark_green><newline><newline>A dry batch may enter a Curing Container. This optional game process can improve quality, value, and stability. You may stop early, but a neglected container can eventually degrade the batch."
    page_9: "<dark_green><bold>9. Quality</bold></dark_green><newline><newline>Final grade combines genetics, care, health, timing, cleanliness, processing, skills, worker performance, and contamination. The scale runs from Spoiled to Verdant Grade."
    page_10: "<dark_green><bold>10. Grinding</bold></dark_green><newline><newline>Load a dry or refined batch into a Grinder. Equipment level and condition affect loss risk. The output keeps its batch lineage and must pass authenticity checks in later menus."
    page_11: "<dark_green><bold>11. Mixing</bold></dark_green><newline><newline>Select up to the configured number of ground batches. The menu shows exact proportions that always total 100%. A new signed mixture records every input batch."
    page_12: "<dark_green><bold>12. Rolling</bold></dark_green><newline><newline>Bring Rolling Paper, a Filter, and ground product or a mixture. Follow the GUI sequence and click in the timing zones. Your result affects duration, stability, value, and material loss."
    page_13: "<dark_green><bold>13. Selling</bold></dark_green><newline><newline>Herbalists buy only authentic eligible batches. Price depends on strain, grade, freshness, demand, reputation, and daily saturation. A sold batch cannot be sold or delivered again."
    page_14: "<dark_green><bold>14. Creating a Farm</bold></dark_green><newline><newline>Use a Farm Selection Wand to mark two corners, then place or use the Farm Manager Table. Regions cannot overlap. The farm menu manages assets, roles, priorities, and upgrades."
    page_15: "<dark_green><bold>15. Hiring a Herbalist</bold></dark_green><newline><newline>Develop a herbalist to Verdant Expert and acquire a Plantation Contract. Sign it once, choose a farm with worker capacity, and provide a bed, workstation, safe route, food, and salary storage."
    page_16: "<dark_green><bold>16. Workers and Salaries</bold></dark_green><newline><newline>Workers reserve tasks, walk to storages and targets, and follow the configured schedule. Keep salary emeralds available each Minecraft day. Pay, rest, safety, tools, and workload determine morale."
  plant_health:
    title: "Plant Health and Care"
    author: "VerdantVice"
    page_1: "<green><bold>Reading the Station</bold></green><newline><newline>Health is the long-term condition. Hydration, nutrition, light, stress, and cleanliness are changing game meters. A scanner reveals more precision as Grower knowledge improves."
    page_2: "<green><bold>Balanced Care</bold></green><newline><newline>Each fictional strain has preferences rather than one universal solution. Keep values near the ranges shown by the scanner; extreme repeated actions create stress instead of instant failure."
    page_3: "<green><bold>Problems and Recovery</bold></green><newline><newline>Conditions gain severity over time. Clean dirt, repair equipment, and treat only compatible problems. Recovery stops further penalties first; lost potential may not fully return."
  strain_guide:
    title: "Strain Guide"
    author: "VerdantVice"
    page_1: "<light_purple><bold>Fictional Strains</bold></light_purple><newline><newline>Strains are configurable game definitions. Rarity affects availability and price, while duration, difficulty, yield, resistance, water use, light preference, and stress sensitivity shape play."
    page_2: "<light_purple><bold>Reading Attributes</bold></light_purple><newline><newline>Base values describe an average seed. A seed's genetic profile modifies them, so two seeds of the same strain may behave differently without changing their identity."
    page_3: "<light_purple><bold>Discovery and Custom Lines</bold></light_purple><newline><newline>Effects remain hidden until discovered. Crossings create named lines with recorded parents, generation, dominant traits, colors, effects, and permanent lineage."
  drying_curing:
    title: "Drying and Curing"
    author: "VerdantVice"
    page_1: "<gold><bold>Rack Preparation</bold></gold><newline><newline>Check capacity, cleanliness, condition, stability, and speed before loading. A dirty or damaged rack increases fictional processing risk."
    page_2: "<gold><bold>Timestamp Stages</bold></gold><newline><newline>Fresh progresses through Wet, Damp, Partially Dry, Almost Ready, and Ready. The configured clock continues for DB-owned batches even when the chunk is unloaded."
    page_3: "<gold><bold>Timing and Refinement</bold></gold><newline><newline>Ready is the safe removal stage. Excessive delay ruins a batch. Optional curing can add a bounded bonus, but neglect can reverse those gains."
  advanced_genetics:
    title: "Advanced Genetics"
    author: "VerdantVice"
    page_1: "<aqua><bold>Profile Grades</bold></aqua><newline><newline>Profiles range from Damaged to Legendary. Grade summarizes seven independent modifiers; it does not guarantee that every trait is equally strong."
    page_2: "<aqua><bold>Crossing</bold></aqua><newline><newline>Select two eligible parents. The game combines weighted traits, applies stability variance, records both parents, and advances the generation."
    page_3: "<aqua><bold>Stability and Naming</bold></aqua><newline><newline>Stability narrows variation and reduces risk. Custom names are normalized and filtered; creators cannot rewrite parents or signed traits."
  farm_management:
    title: "Farm Management"
    author: "VerdantVice"
    page_1: "<dark_green><bold>Region and Roles</bold></dark_green><newline><newline>A farm is one protected cuboid. Give members only the permissions they need for planting, storage, processing, workers, settings, or upgrades."
    page_2: "<dark_green><bold>Storage and Priorities</bold></dark_green><newline><newline>Link chests by type. Workers use only linked storage. Prioritize plant survival, restrict strains, and protect rare or legendary seeds."
    page_3: "<dark_green><bold>People First</bold></dark_green><newline><newline>Provide a bed, food, safe paths, breaks, tools, and daily salary. Healthy morale improves work; neglect leads to refusal and departure."
  perfect_batch:
    title: "Perfect Batch Secrets"
    author: "VerdantVice"
    page_1: "<yellow><bold>No Single Shortcut</bold></yellow><newline><newline>Quality combines many fictional mechanics. Excellent genetics cannot erase poor care, contamination, or badly timed processing."
    page_2: "<yellow><bold>Protect Potential</bold></yellow><newline><newline>Use a stable profile, maintain health and cleanliness, resolve problems early, and harvest inside the best window."
    page_3: "<yellow><bold>Careful, Traceable Processing</bold></yellow><newline><newline>Maintain equipment and match worker skills. Every transformation records losses, lineage, and authenticity; copied lore never changes registered quality."

