  debug-created: "<green>Utworzono raport diagnostyczny: <path></green>"
  player-reset: "<green>Zresetowano dane VerdantVice gracza <player>.</green>"
  contract-created: "<green>Utworzono kontrakt <contract_id>.</green>"
  market-updated: "<green>Zaktualizowano stan rynku.</green>"

commands:
  root:
    description: "Otwiera VerdantVice lub wyświetla pomoc komend."
    usage: "/vv [podkomenda]"
  help:
    description: "Pokazuje dostępne komendy."
    usage: "/vv help [strona]"
  guide:
    description: "Otwiera przewodnik po grze."
    usage: "/vv guide"
  profile:
    description: "Wyświetla profil VerdantVice."
    usage: "/vv profile [gracz]"
  skills:
    description: "Otwiera cztery drzewka umiejętności."
    usage: "/vv skills"
  strains:
    description: "Pokazuje odkryte fikcyjne odmiany."
    usage: "/vv strains [odmiana]"
  recipes:
    description: "Wyświetla odblokowane receptury obróbki."
    usage: "/vv recipes"
  market:
    description: "Pokazuje bieżący popyt i ceny."
    usage: "/vv market [odmiana]"
  contracts:
    description: "Otwiera twoje kontrakty."
    usage: "/vv contracts"
  farm:
    description: "Otwiera zarządzanie plantacją."
    usage: "/vv farm"
    create:
      description: "Tworzy plantację w zaznaczonym regionie."
      usage: "/vv farm create <nazwa>"
    delete:
      description: "Bezpiecznie usuwa plantację po potwierdzeniu."
      usage: "/vv farm delete <nazwa>"
    invite:
      description: "Zaprasza gracza do plantacji."
      usage: "/vv farm invite <gracz>"
    remove:
      description: "Usuwa członka plantacji."
      usage: "/vv farm remove <gracz>"
  workers:
    description: "Otwiera zarządzanie pracownikami."
    usage: "/vv workers"
  language:
    description: "Wybiera obsługiwany język."
    usage: "/vv language <pl_PL|en_US|de_DE|es_ES|cs_CZ|uk_UA>"
  notifications:
    description: "Ustawia kanały i rodzaje powiadomień."
    usage: "/vv notifications"
  resourcepack:
    description: "Ponownie proponuje opcjonalną paczkę zasobów."
    usage: "/vv resourcepack"
  genetics: { description: "Tworzy wlasna linie z dwoch podpisanych nasion.", usage: "/vv genetics <nazwa>" }
  admin:
    description: "Narzędzia administracyjne VerdantVice."
    usage: "/vv admin <podkomenda>"
    reload:
      description: "Przeładowuje bezpieczne ustawienia i katalogi."
      usage: "/vv admin reload"
    save:
      description: "Zapisuje dane oczekujące w kolejce."
      usage: "/vv admin save"
    give:
      description: "Przekazuje zarejestrowany customowy przedmiot."
      usage: "/vv admin give <gracz> <przedmiot> [ilość]"
    seed:
      description: "Przekazuje podpisane nasiono z wygenerowaną genetyką."
      usage: "/vv admin seed <gracz> <odmiana> [klasa]"
    plant:
      description: "Tworzy roślinę na wskazanym stanowisku."
      usage: "/vv admin plant <odmiana>"
    setstage:
      description: "Zmienia etap wskazanej rośliny."
      usage: "/vv admin setstage <etap>"
    setquality:
      description: "Zmienia jakość trzymanej partii."
      usage: "/vv admin setquality <klasa>"
    spawnherbalist:
      description: "Przywołuje zarejestrowanego zielarza."
      usage: "/vv admin spawnherbalist [poziom]"
    hireworker:
      description: "Zatrudnia wskazanego zielarza na plantacji."
      usage: "/vv admin hireworker <plantacja>"
    removeplant:
      description: "Bezpiecznie usuwa wskazaną roślinę."
      usage: "/vv admin removeplant"
    inspect:
      description: "Sprawdza obiekt VerdantVice i jego stan w rejestrze."
      usage: "/vv admin inspect"
    market:
      description: "Sprawdza lub zmienia notowanie bądź wydarzenie rynkowe."
      usage: "/vv admin market <show|set|event> ..."
    contract:
      description: "Tworzy lub sprawdza kontrakt."
      usage: "/vv admin contract <create|inspect> ..."
    resetplayer:
      description: "Resetuje dane gracza po potwierdzeniu."
      usage: "/vv admin resetplayer <gracz> confirm"
    migrate:
      description: "Uruchamia oczekujące migracje bazy."
      usage: "/vv admin migrate"
    database:
      description: "Pokazuje stan bazy danych i kolejki."
      usage: "/vv admin database"
    debug:
      description: "Tworzy zanonimizowany raport diagnostyczny."
      usage: "/vv admin debug"
    performance:
      description: "Pokazuje parametry schedulerów, cache i kolejek."
      usage: "/vv admin performance"

