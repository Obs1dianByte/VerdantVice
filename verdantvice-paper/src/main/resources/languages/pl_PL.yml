book:
  basics:
    title: "Podstawy VerdantVice"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Zdobywanie nasion</bold></dark_green><newline><newline>Znajdź sprawdzonego farmera-zielarza i otwórz handel Verdant. Najpierw dostępne są podstawowe nasiona, a wyższe poziomy zielarza odblokowują rzadsze fikcyjne odmiany. Każde nasiono ma podpis i własny profil genetyczny."
    page_2: "<dark_green><bold>2. Sadzenie</bold></dark_green><newline><newline>Postaw Doniczkę uprawną w miejscu, gdzie masz prawo budować i uprawiać. Trzymając poprawne nasiono, użyj pustego stanowiska. Przed posadzeniem sprawdzane są limity, odstępy, właściciel i ochrona regionu."
    page_3: "<dark_green><bold>3. Kontrola roślin</bold></dark_green><newline><newline>Pusta ręka pokazuje krótkie podsumowanie, a Skaner roślin — szczegóły. Wyższy poziom Hodowcy i przewodniki odsłaniają dokładne zdrowie, nawodnienie, stres, okno zbioru i genetykę."
    page_4: "<dark_green><bold>4. Podlewanie</bold></dark_green><newline><newline>Użyj Konewki, gdy spada nawodnienie. Woda jest fikcyjnym wskaźnikiem gry: niedobór spowalnia wzrost, a powtarzane podlewanie ponad preferowany zakres może wywołać Przelanie."
    page_5: "<dark_green><bold>5. Leczenie problemów</bold></dark_green><newline><newline>Sprawdź nazwę problemu, a potem wybierz Zestaw czyszczący, Oprysk, Pakiet odżywczy lub Zestaw naprawczy. Problemy obniżają potencjał stopniowo; nie niszczą od razu zdrowej rośliny."
    page_6: "<dark_green><bold>6. Zbieranie</bold></dark_green><newline><newline>Moment zbioru mieści się między „Zdecydowanie za wcześnie” a „Przejrzała”. Wyróżnione okno daje najlepszą masę i jakość. Zbiór tworzy jedną zarejestrowaną partię z trwałym pochodzeniem i podpisem."
    page_7: "<dark_green><bold>7. Suszenie</bold></dark_green><newline><newline>Otwórz czysty Stojak do suszenia i włóż świeżą partię. Plugin bezpiecznie przechowuje ją i oblicza etapy według czasu. Wyjmij ją w pobliżu etapu Gotowa; zbyt długie czekanie prowadzi do przesuszenia lub zniszczenia."
    page_8: "<dark_green><bold>8. Dojrzewanie</bold></dark_green><newline><newline>Suchą partię można włożyć do Pojemnika dojrzewającego. Ten opcjonalny proces gry może poprawić jakość, wartość i stabilność. Można przerwać go wcześniej, lecz zaniedbany pojemnik z czasem pogorszy partię."
    page_9: "<dark_green><bold>9. Ocena jakości</bold></dark_green><newline><newline>Końcowa klasa łączy genetykę, pielęgnację, zdrowie, moment zbioru, czystość, obróbkę, umiejętności, pracę NPC i zanieczyszczenie. Skala prowadzi od Zepsutej do Klasy Verdant."
    page_10: "<dark_green><bold>10. Mielenie</bold></dark_green><newline><newline>Włóż suchą lub dojrzałą partię do Grindera. Poziom i stan urządzenia wpływają na ryzyko straty. Wynik zachowuje pochodzenie partii i przechodzi kontrolę autentyczności w kolejnych menu."
    page_11: "<dark_green><bold>11. Mieszanie</bold></dark_green><newline><newline>Wybierz maksymalnie tyle zmielonych partii, ile pozwala konfiguracja. Menu pokazuje dokładne proporcje sumujące się do 100%. Nowa podpisana mieszanka zapisuje wszystkie partie wejściowe."
    page_12: "<dark_green><bold>12. Skręcanie</bold></dark_green><newline><newline>Przygotuj Bibułkę, Filterek oraz zmielony produkt lub mieszankę. Wykonuj kroki GUI i klikaj w polach czasowych. Wynik wpływa na czas efektu, stabilność, wartość i stratę materiału."
    page_13: "<dark_green><bold>13. Sprzedaż</bold></dark_green><newline><newline>Zielarze skupują tylko autentyczne, odpowiednie partie. Cena zależy od odmiany, klasy, świeżości, popytu, reputacji i dziennego nasycenia. Sprzedanej partii nie można wykorzystać ponownie."
    page_14: "<dark_green><bold>14. Zakładanie plantacji</bold></dark_green><newline><newline>Różdżką zaznacz dwa narożniki, a następnie postaw lub użyj Stołu zarządcy. Regiony nie mogą na siebie nachodzić. Menu plantacji zarządza urządzeniami, rolami, priorytetami i ulepszeniami."
    page_15: "<dark_green><bold>15. Zatrudnianie zielarza</bold></dark_green><newline><newline>Rozwiń zielarza do Eksperta Verdant i zdobądź Kontrakt plantacyjny. Podpisz go raz, wybierz plantację z wolnym limitem i zapewnij łóżko, stanowisko, bezpieczną trasę, jedzenie oraz skrzynię pensji."
    page_16: "<dark_green><bold>16. Pracownicy i pensje</bold></dark_green><newline><newline>Pracownicy rezerwują zadania, chodzą do magazynów i celów oraz przestrzegają grafiku. Zapewnij szmaragdy na każdy dzień Minecrafta. Wypłaty, odpoczynek, bezpieczeństwo, narzędzia i obciążenie kształtują morale."
  plant_health:
    title: "Zdrowie i pielęgnacja roślin"
    author: "VerdantVice"
    page_1: "<green><bold>Odczyty stanowiska</bold></green><newline><newline>Zdrowie opisuje stan długoterminowy. Nawodnienie, odżywienie, światło, stres i czystość to zmienne wskaźniki gry. Skaner pokazuje je dokładniej wraz z rozwojem wiedzy Hodowcy."
    page_2: "<green><bold>Zrównoważona opieka</bold></green><newline><newline>Każda fikcyjna odmiana ma własne preferencje. Utrzymuj wartości blisko zakresów skanera; skrajne, powtarzane działania zwiększają stres."
    page_3: "<green><bold>Problemy i powrót do formy</bold></green><newline><newline>Natężenie problemów rośnie z czasem. Czyść, naprawiaj i lecz tylko zgodny problem. Leczenie zatrzymuje dalsze kary, lecz utracony potencjał nie zawsze wraca."
  strain_guide:
    title: "Przewodnik po odmianach"
    author: "VerdantVice"
    page_1: "<light_purple><bold>Fikcyjne odmiany</bold></light_purple><newline><newline>Odmiany są definicjami gry. Rzadkość wpływa na dostępność i cenę, a czas, trudność, plon, odporność, zużycie wody, światło i stres kształtują rozgrywkę."
    page_2: "<light_purple><bold>Odczytywanie cech</bold></light_purple><newline><newline>Wartości bazowe opisują przeciętne nasiono. Profil genetyczny je modyfikuje, dlatego dwa nasiona tej samej odmiany mogą zachowywać się inaczej."
    page_3: "<light_purple><bold>Odkrycia i własne linie</bold></light_purple><newline><newline>Efekty pozostają ukryte do odkrycia. Krzyżówki tworzą nazwane linie z zapisanymi rodzicami, pokoleniem, cechami, kolorami, efektami i trwałym pochodzeniem."
  drying_curing:
    title: "Suszenie i dojrzewanie"
    author: "VerdantVice"
    page_1: "<gold><bold>Przygotowanie stojaka</bold></gold><newline><newline>Przed załadunkiem sprawdź pojemność, czystość, stan, stabilność i szybkość. Brudny lub uszkodzony stojak zwiększa fikcyjne ryzyko procesu."
    page_2: "<gold><bold>Etapy czasowe</bold></gold><newline><newline>Świeża partia przechodzi przez Mokrą, Wilgotną, Częściowo suchą, Prawie gotową i Gotową. Zegar działa również bez wczytanego chunka."
    page_3: "<gold><bold>Właściwy moment i ulepszanie</bold></gold><newline><newline>Gotowa to bezpieczny etap wyjęcia. Zwłoka niszczy partię. Opcjonalne dojrzewanie daje ograniczony bonus, lecz zaniedbanie może go odwrócić."
  advanced_genetics:
    title: "Zaawansowana genetyka"
    author: "VerdantVice"
    page_1: "<aqua><bold>Klasy profili</bold></aqua><newline><newline>Profile prowadzą od Uszkodzonego do Legendarnego. Klasa podsumowuje siedem niezależnych modyfikatorów; nie oznacza, że każda cecha jest równie mocna."
    page_2: "<aqua><bold>Krzyżowanie</bold></aqua><newline><newline>Wybierz dwa profile rodzicielskie. Gra łączy ważone cechy, dodaje wariancję stabilności, zapisuje rodziców i zwiększa pokolenie."
    page_3: "<aqua><bold>Stabilność i nazwy</bold></aqua><newline><newline>Stabilność ogranicza odchylenia i ryzyko. Nazwy są normalizowane i filtrowane; twórca nie może zmienić rodziców ani podpisanych cech."
  farm_management:
    title: "Zarządzanie plantacją"
    author: "VerdantVice"
    page_1: "<dark_green><bold>Region i role</bold></dark_green><newline><newline>Plantacja to jeden chroniony prostopadłościan. Przydzielaj tylko potrzebne prawa do sadzenia, magazynów, obróbki, pracowników, ustawień lub ulepszeń."
    page_2: "<dark_green><bold>Magazyny i priorytety</bold></dark_green><newline><newline>Przypisuj skrzynie według typu. Pracownicy używają tylko przypisanych magazynów. Najpierw ratuj rośliny, ograniczaj odmiany i chroń rzadkie nasiona."
    page_3: "<dark_green><bold>Ludzie przede wszystkim</bold></dark_green><newline><newline>Zapewnij łóżko, jedzenie, bezpieczne drogi, przerwy, narzędzia i codzienną pensję. Dobre morale usprawnia pracę; zaniedbanie prowadzi do odejścia."
  perfect_batch:
    title: "Sekrety idealnej partii"
    author: "VerdantVice"
    page_1: "<yellow><bold>Nie ma jednego skrótu</bold></yellow><newline><newline>Jakość łączy wiele fikcyjnych mechanik. Doskonała genetyka nie usuwa skutków złej opieki, zanieczyszczenia ani błędnej obróbki."
    page_2: "<yellow><bold>Chroń potencjał</bold></yellow><newline><newline>Wybierz stabilny profil, dbaj o zdrowie i czystość, szybko rozwiązuj problemy i zbieraj w najlepszym oknie."
    page_3: "<yellow><bold>Ostrożna i jawna obróbka</bold></yellow><newline><newline>Konserwuj urządzenia i dobieraj specjalizacje. Każda transformacja zapisuje straty, pochodzenie i autentyczność; skopiowane lore nie zmienia jakości."
