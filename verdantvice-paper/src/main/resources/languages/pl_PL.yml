  quality-set: "<green>Ustawiono jakość partii: <quality>.</green>"
  herbalist-spawned: "<green>Utworzono zielarza <herbalist>.</green>"
  worker-hired: "<green><worker> dołączył do plantacji <farm>.</green>"
  farm-created: "<green>Utworzono plantację <farm>.</green>"
  farm-deleted: "<green>Bezpiecznie usunięto plantację <farm>.</green>"
  invitation-sent: "<green>Wysłano zaproszenie do gracza <player>.</green>"
  member-removed: "<green>Usunięto gracza <player> z plantacji.</green>"
  notification-settings: "<green>Zaktualizowano ustawienia powiadomień.</green>"
  resourcepack-sent: "<green>Wysłano prośbę o pobranie paczki zasobów.</green>"
