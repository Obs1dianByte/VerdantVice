  strong-effect-active: "<red>Nie możesz użyć kolejnego silnego produktu, dopóki trwa obecny efekt.</red>"
  no-space: "<red>W tym miejscu brakuje wolnej przestrzeni.</red>"
  too-far: "<red>Jesteś za daleko.</red>"

success:
  reload: "<green>Przeładowano bezpieczne ustawienia, tłumaczenia i katalogi.</green>"
  save: "<green>Wszystkie zmienione dane dodano do kolejki zapisu.</green>"
  language: "<green>Wybrany język: <language>.</green>"
  item-given: "<green>Przekazano <amount> × <item> graczowi <player>.</green>"
  seed-given: "<green>Przekazano nasiono <strain> graczowi <player>.</green>"
