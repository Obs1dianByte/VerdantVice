  world-unavailable: "<red>Wymagany świat jest obecnie niedostępny.</red>"
  chunk-unavailable: "<red>Ten obszar nie jest wczytany. Podejdź bliżej i spróbuj ponownie.</red>"
  target-not-found: "<red>Nie znaleziono poprawnego celu.</red>"
  invalid-item: "<red>To nie jest poprawny przedmiot VerdantVice.</red>"
