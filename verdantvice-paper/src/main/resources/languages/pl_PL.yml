  protected-region: "<red>Nie możesz używać wyposażenia VerdantVice na tym chronionym obszarze.</red>"
  farm-permission: "<red>Twoja rola na plantacji nie pozwala na tę czynność.</red>"
  configuration-invalid: "<red>Konfiguracja <file> jest niepoprawna. Nadal obowiązują poprzednie bezpieczne wartości.</red>"
  restart-required: "<yellow>Ta zmiana wymaga restartu serwera.</yellow>"
  unsafe-reload: "<red>Tej części nie można bezpiecznie przeładować. Zrestartuj serwer.</red>"
