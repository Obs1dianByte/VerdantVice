  contract-created: "<green>Auftrag <contract_id> wurde erstellt.</green>"
  market-updated: "<green>Marktdaten wurden aktualisiert.</green>"

commands:
  root:
    description: "Öffnet VerdantVice oder zeigt die Befehlshilfe."
    usage: "/vv [Unterbefehl]"
  help:
    description: "Zeigt die für dich verfügbaren Befehle."
    usage: "/vv help [Seite]"
  guide:
    description: "Öffnet den Spielleitfaden."
    usage: "/vv guide"
  profile:
    description: "Zeigt ein VerdantVice-Profil."
    usage: "/vv profile [Spieler]"
  skills:
    description: "Öffnet deine vier Fertigkeitsbäume."
    usage: "/vv skills"
  strains:
    description: "Zeigt entdeckte fiktive Sorten."
    usage: "/vv strains [Sorte]"
  recipes:
    description: "Zeigt freigeschaltete Verarbeitungsrezepte."
    usage: "/vv recipes"
  market:
    description: "Zeigt Nachfrage und aktuelle Preise."
    usage: "/vv market [Sorte]"
  contracts:
    description: "Öffnet deine Aufträge."
    usage: "/vv contracts"
  farm:
    description: "Öffnet die Farmverwaltung."
    usage: "/vv farm"
    create:
      description: "Erstellt eine Farm im markierten Gebiet."
      usage: "/vv farm create <Name>"
    delete:
      description: "Löscht eine Farm nach Bestätigung sicher."
      usage: "/vv farm delete <Name>"
    invite:
      description: "Lädt einen Spieler auf deine Farm ein."
      usage: "/vv farm invite <Spieler>"
    remove:
      description: "Entfernt ein Farmmitglied."
      usage: "/vv farm remove <Spieler>"
  workers:
    description: "Öffnet die Arbeiterverwaltung."
    usage: "/vv workers"
  language:
    description: "Wählt eine unterstützte Sprache."
    usage: "/vv language <pl_PL|en_US|de_DE|es_ES|cs_CZ|uk_UA>"
  notifications:
    description: "Konfiguriert Themen und Kanäle für Meldungen."
    usage: "/vv notifications"
  resourcepack:
    description: "Fordert das optionale VerdantVice-Resourcepack an."
    usage: "/vv resourcepack"
  genetics: { description: "Erstellt eine eigene Linie aus zwei Samen.", usage: "/vv genetics <name>" }
  admin:
    description: "VerdantVice-Verwaltungswerkzeuge."
    usage: "/vv admin <Unterbefehl>"
    reload:
      description: "Lädt sichere Einstellungen und Kataloge neu."
      usage: "/vv admin reload"
    save:
      description: "Schreibt vorgemerkte Daten."
      usage: "/vv admin save"
    give:
      description: "Gibt einen registrierten Spezialgegenstand."
      usage: "/vv admin give <Spieler> <Gegenstand> [Menge]"
    seed:
      description: "Gibt einen signierten Samen mit erzeugter Genetik."
      usage: "/vv admin seed <Spieler> <Sorte> [Klasse]"
    plant:
      description: "Erstellt eine Pflanze an der anvisierten Station."
      usage: "/vv admin plant <Sorte>"
    setstage:
      description: "Ändert die Phase der anvisierten Pflanze."
      usage: "/vv admin setstage <Phase>"
    setquality:
      description: "Ändert die Qualität der gehaltenen Charge."
      usage: "/vv admin setquality <Klasse>"
    spawnherbalist:
      description: "Erschafft einen registrierten Kräuterkundigen."
      usage: "/vv admin spawnherbalist [Stufe]"
    hireworker:
      description: "Stellt den anvisierten Kräuterkundigen ein."
      usage: "/vv admin hireworker <Farm>"
    removeplant:
      description: "Entfernt die anvisierte Pflanze sicher."
      usage: "/vv admin removeplant"
    inspect:
      description: "Prüft ein VerdantVice-Objekt und dessen Registerstatus."
      usage: "/vv admin inspect"
    market:
      description: "Prüft oder ändert einen Marktpreis oder ein Ereignis."
      usage: "/vv admin market <show|set|event> ..."
    contract:
      description: "Erstellt oder prüft einen Auftrag."
      usage: "/vv admin contract <create|inspect> ..."
    resetplayer:
      description: "Setzt Spielerdaten nach Bestätigung zurück."
      usage: "/vv admin resetplayer <Spieler> confirm"
    migrate:
      description: "Führt ausstehende Datenbankmigrationen aus."
      usage: "/vv admin migrate"
    database:
      description: "Zeigt Datenbankzustand und Warteschlange."
      usage: "/vv admin database"
    debug:
      description: "Erstellt einen bereinigten Diagnosebericht."
      usage: "/vv admin debug"
    performance:
      description: "Zeigt Scheduler-, Cache- und Warteschlangenwerte."
      usage: "/vv admin performance"

