    title: "VerdantVice-Grundlagen"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Samen erhalten</bold></dark_green><newline><newline>Finde einen geprüften Bauern-Kräuterkundigen und öffne seinen Verdant-Handel. Grundsamen sind zuerst verfügbar; höhere Stufen bieten seltenere fiktive Sorten. Jeder Samen besitzt ein signiertes, einzigartiges Genprofil."
    page_2: "<dark_green><bold>2. Pflanzen</bold></dark_green><newline><newline>Stelle einen Anzuchttopf dort auf, wo du Bau- und Farmrechte hast. Benutze die leere Station mit einem gültigen Samen. Limits, Abstand, Besitz und externer Gebietsschutz werden vorher geprüft."
    page_3: "<dark_green><bold>3. Prüfen</bold></dark_green><newline><newline>Eine leere Hand zeigt die Übersicht, der Pflanzenscanner genaue Werte. Höhere Gärtnerstufen und Bücher enthüllen Gesundheit, Bewässerung, Stress, Erntefenster und Genetik."
    page_4: "<dark_green><bold>4. Gießen</bold></dark_green><newline><newline>Nutze die Gießkanne bei niedriger Bewässerung. Wasser ist ein fiktiver Spielwert: Mangel bremst das Wachstum, wiederholtes Gießen über den Wunschbereich erzeugt Überwässerung."
    page_5: "<dark_green><bold>5. Probleme lösen</bold></dark_green><newline><newline>Prüfe das gemeldete Problem und nutze Reinigungsset, Behandlungsspray, Nährstoffpaket oder Reparaturset. Probleme senken das Potenzial schrittweise und zerstören gesunde Pflanzen nicht sofort."
    page_6: "<dark_green><bold>6. Ernten</bold></dark_green><newline><newline>Der Erntezeitpunkt reicht von Viel zu früh bis Überreif. Das markierte Fenster bietet Gewicht und Qualität. Die Ernte erstellt eine registrierte Charge mit dauerhaftem Ursprung und Signatur."
    page_7: "<dark_green><bold>7. Trocknen</bold></dark_green><newline><newline>Öffne ein sauberes Trockengestell und lege eine frische Charge ein. Das Plugin verwahrt sie sicher und berechnet Phasen nach Zeit. Entnimm sie bei Bereit; zu langes Warten führt zu Übertrocknet oder Ruiniert."
    page_8: "<dark_green><bold>8. Reifen</bold></dark_green><newline><newline>Eine trockene Charge kann in den Reifebehälter. Dieser optionale Spielvorgang kann Qualität, Wert und Stabilität erhöhen. Frühes Beenden ist möglich, doch Vernachlässigung verschlechtert die Charge."
    page_9: "<dark_green><bold>9. Qualität</bold></dark_green><newline><newline>Die Endklasse verbindet Genetik, Pflege, Gesundheit, Erntezeit, Sauberkeit, Verarbeitung, Fertigkeiten, NPC-Arbeit und Verunreinigung. Die Skala reicht von Verdorben bis Verdant-Klasse."
    page_10: "<dark_green><bold>10. Mahlen</bold></dark_green><newline><newline>Lege eine trockene oder gereifte Charge in die Mühle. Stufe und Zustand bestimmen das Verlustrisiko. Das Ergebnis behält seine Chargenherkunft und wird in späteren Menüs geprüft."
    page_11: "<dark_green><bold>11. Mischen</bold></dark_green><newline><newline>Wähle bis zur eingestellten Höchstzahl gemahlener Chargen. Das Menü zeigt genaue Anteile mit insgesamt 100 %. Die neue signierte Mischung vermerkt alle Eingaben."
    page_12: "<dark_green><bold>12. Rollen</bold></dark_green><newline><newline>Bringe Rollpapier, Filter und Mahlgut oder eine Mischung. Folge der GUI-Reihenfolge und klicke in den Zeitfenstern. Das Ergebnis beeinflusst Dauer, Stabilität, Wert und Materialverlust."
    page_13: "<dark_green><bold>13. Verkaufen</bold></dark_green><newline><newline>Kräuterkundige kaufen nur echte, geeignete Chargen. Der Preis hängt von Sorte, Klasse, Frische, Nachfrage, Ruf und täglicher Sättigung ab. Eine verkaufte Charge kann nie erneut verwendet werden."
    page_14: "<dark_green><bold>14. Farm gründen</bold></dark_green><newline><newline>Markiere zwei Ecken mit dem Farmstab und platziere oder nutze den Verwaltungstisch. Gebiete dürfen sich nicht überschneiden. Das Farmmenü verwaltet Anlagen, Rollen, Prioritäten und Ausbauten."
    page_15: "<dark_green><bold>15. Kräuterkundigen einstellen</bold></dark_green><newline><newline>Entwickle ihn zum Verdant-Experten und erwirb einen Farmvertrag. Unterzeichne ihn einmal, wähle eine Farm mit Platz und biete Bett, Arbeitsplatz, sicheren Weg, Nahrung und Lohnlager."
    page_16: "<dark_green><bold>16. Arbeiter und Löhne</bold></dark_green><newline><newline>Arbeiter reservieren Aufgaben, gehen zu Lagern und Zielen und folgen dem Arbeitsplan. Halte pro Minecraft-Tag Smaragde bereit. Lohn, Ruhe, Sicherheit, Werkzeuge und Last bestimmen ihre Moral."
  plant_health:
    title: "Pflanzengesundheit und Pflege"
    author: "VerdantVice"
    page_1: "<green><bold>Station lesen</bold></green><newline><newline>Gesundheit ist der langfristige Zustand. Bewässerung, Nährwert, Licht, Stress und Sauberkeit sind veränderliche Spielwerte. Der Scanner zeigt mit höherem Gärtnerwissen mehr Genauigkeit."
    page_2: "<green><bold>Ausgewogene Pflege</bold></green><newline><newline>Jede fiktive Sorte hat eigene Vorlieben. Halte Werte nahe den Scannerbereichen; wiederholte Extreme erzeugen Stress statt sofortigen Ausfalls."
    page_3: "<green><bold>Probleme und Erholung</bold></green><newline><newline>Zustände werden mit der Zeit stärker. Reinige, repariere und behandle nur passende Probleme. Behandlung stoppt weitere Abzüge, verlorenes Potenzial kehrt aber nicht immer zurück."
  strain_guide:
    title: "Sortenführer"
    author: "VerdantVice"
    page_1: "<light_purple><bold>Fiktive Sorten</bold></light_purple><newline><newline>Sorten sind Spieldefinitionen. Seltenheit beeinflusst Verfügbarkeit und Preis; Dauer, Schwierigkeit, Ertrag, Widerstand, Wasser, Licht und Stress prägen das Spiel."
    page_2: "<light_purple><bold>Eigenschaften lesen</bold></light_purple><newline><newline>Grundwerte beschreiben einen durchschnittlichen Samen. Sein Genprofil verändert sie, daher können zwei Samen derselben Sorte unterschiedlich sein."
    page_3: "<light_purple><bold>Entdeckungen und eigene Linien</bold></light_purple><newline><newline>Effekte bleiben bis zur Entdeckung verborgen. Kreuzungen erzeugen benannte Linien mit gespeicherten Eltern, Generation, Merkmalen, Farben, Effekten und Herkunft."
  drying_curing:
    title: "Trocknen und Reifen"
    author: "VerdantVice"
    page_1: "<gold><bold>Gestell vorbereiten</bold></gold><newline><newline>Prüfe vor dem Beladen Kapazität, Sauberkeit, Zustand, Stabilität und Tempo. Schmutzige oder beschädigte Gestelle erhöhen das fiktive Prozessrisiko."
    page_2: "<gold><bold>Zeitphasen</bold></gold><newline><newline>Frisch wird Nass, Feucht, Teilgetrocknet, Fast bereit und Bereit. Die konfigurierte Uhr läuft auch bei entladenem Chunk weiter."
    page_3: "<gold><bold>Zeitpunkt und Veredelung</bold></gold><newline><newline>Bereit ist die sichere Entnahmephase. Zu langes Warten ruiniert die Charge. Optionale Reifung gibt einen begrenzten Bonus, den Vernachlässigung umkehren kann."
  advanced_genetics:
    title: "Fortgeschrittene Genetik"
    author: "VerdantVice"
    page_1: "<aqua><bold>Profilklassen</bold></aqua><newline><newline>Profile reichen von Beschädigt bis Legendär. Die Klasse fasst sieben unabhängige Modifikatoren zusammen; nicht jedes Merkmal ist gleich stark."
    page_2: "<aqua><bold>Kreuzen</bold></aqua><newline><newline>Wähle zwei Elternprofile. Das Spiel verbindet gewichtete Merkmale, wendet Stabilitätsstreuung an, speichert beide Eltern und erhöht die Generation."
    page_3: "<aqua><bold>Stabilität und Namen</bold></aqua><newline><newline>Stabilität begrenzt Abweichungen und Risiken. Namen werden normalisiert und gefiltert; Eltern und signierte Merkmale bleiben unveränderlich."
  farm_management:
    title: "Farmverwaltung"
    author: "VerdantVice"
    page_1: "<dark_green><bold>Gebiet und Rollen</bold></dark_green><newline><newline>Eine Farm ist ein geschützter Quader. Gib Mitgliedern nur benötigte Rechte für Pflanzen, Lager, Verarbeitung, Arbeiter, Einstellungen oder Ausbauten."
    page_2: "<dark_green><bold>Lager und Prioritäten</bold></dark_green><newline><newline>Verbinde Kisten nach Typ; Arbeiter nutzen nur verbundene Lager. Priorisiere Pflanzenrettung, beschränke Sorten und schütze seltene Samen."
    page_3: "<dark_green><bold>Menschen zuerst</bold></dark_green><newline><newline>Biete Bett, Nahrung, sichere Wege, Pausen, Werkzeuge und Tageslohn. Gute Moral verbessert die Arbeit; Vernachlässigung führt zum Weggang."
  perfect_batch:
    title: "Geheimnisse der perfekten Charge"
    author: "VerdantVice"
    page_1: "<yellow><bold>Keine einzelne Abkürzung</bold></yellow><newline><newline>Qualität verbindet viele fiktive Mechaniken. Hervorragende Genetik beseitigt schlechte Pflege, Verunreinigung oder falsche Verarbeitung nicht."
    page_2: "<yellow><bold>Potenzial schützen</bold></yellow><newline><newline>Nutze ein stabiles Profil, halte Gesundheit und Sauberkeit hoch, löse Probleme früh und ernte im besten Fenster."
    page_3: "<yellow><bold>Sorgfältig und nachvollziehbar</bold></yellow><newline><newline>Warte Geräte und wähle passende Fachkräfte. Jede Umwandlung speichert Verlust, Herkunft und Echtheit; kopierte Lore ändert keine Qualität."
