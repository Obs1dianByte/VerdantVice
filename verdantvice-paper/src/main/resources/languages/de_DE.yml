    description: "<gray>Platziere ihn als geschützte Anbaustation.</gray>"
  watering_can:
    name: "<aqua>Gießkanne</aqua>"
    description: "<gray>Erhöht die Bewässerung. Zu viel kann Überwässerung auslösen.</gray>"
  plant_scanner:
    name: "<aqua>Pflanzenscanner</aqua>"
    description: "<gray>Zeigt Werte, die deine Gärtner-Fertigkeit freigeschaltet hat.</gray>"
  cleaning_kit:
    name: "<white>Reinigungsset</white>"
    description: "<gray>Verbessert die Sauberkeit und senkt das Verunreinigungsrisiko.</gray>"
  treatment_spray:
    name: "<yellow>Behandlungsspray</yellow>"
    description: "<gray>Behandelt ausgewählte fiktive Schädlinge und Zustände.</gray>"
