  plant-removed: "<green>Pflanze <plant_id> wurde sicher entfernt.</green>"
  stage-set: "<green>Pflanzenphase auf <stage> gesetzt.</green>"
  quality-set: "<green>Chargenqualität auf <quality> gesetzt.</green>"
  herbalist-spawned: "<green>Kräuterkundiger <herbalist> wurde erstellt.</green>"
  worker-hired: "<green><worker> arbeitet nun auf Farm <farm>.</green>"
  farm-created: "<green>Farm <farm> wurde erstellt.</green>"
  farm-deleted: "<green>Farm <farm> wurde sicher gelöscht.</green>"
