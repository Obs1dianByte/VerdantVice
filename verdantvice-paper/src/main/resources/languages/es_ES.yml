    setstage: { description: "Cambia la fase de la planta señalada.", usage: "/vv admin setstage <fase>" }
    setquality: { description: "Cambia la calidad del lote en la mano.", usage: "/vv admin setquality <clase>" }
    spawnherbalist: { description: "Invoca un herbolario registrado.", usage: "/vv admin spawnherbalist [nivel]" }
    hireworker: { description: "Contrata al herbolario señalado.", usage: "/vv admin hireworker <plantación>" }
    removeplant: { description: "Retira con seguridad la planta señalada.", usage: "/vv admin removeplant" }
    inspect: { description: "Inspecciona un objeto y su registro.", usage: "/vv admin inspect" }
    market: { description: "Consulta o modifica una cotización o evento.", usage: "/vv admin market <show|set|event> ..." }
    contract: { description: "Crea o consulta un contrato.", usage: "/vv admin contract <create|inspect> ..." }
    resetplayer: { description: "Restablece los datos de un jugador.", usage: "/vv admin resetplayer <jugador> confirm" }
    migrate: { description: "Ejecuta migraciones pendientes.", usage: "/vv admin migrate" }
    database: { description: "Muestra la salud de la base y sus colas.", usage: "/vv admin database" }
