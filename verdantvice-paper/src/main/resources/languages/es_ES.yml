book:
  basics:
    title: "Fundamentos de VerdantVice"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Conseguir semillas</bold></dark_green><newline><newline>Busca un granjero herbolario verificado. Los niveles altos ofrecen variedades ficticias más raras; cada semilla tiene firma y genética únicas."
    page_2: "<dark_green><bold>2. Plantar</bold></dark_green><newline><newline>Coloca una Maceta de cultivo con permisos y úsala con una semilla válida. Se comprueban límites, separación, dueño y región."
    page_3: "<dark_green><bold>3. Inspeccionar</bold></dark_green><newline><newline>La mano vacía muestra un resumen; el Escáner revela datos según tu nivel y libros."
    page_4: "<dark_green><bold>4. Regar</bold></dark_green><newline><newline>Riega cuando baje la hidratación. Es un medidor ficticio: tanto la falta como el exceso perjudican."
    page_5: "<dark_green><bold>5. Resolver problemas</bold></dark_green><newline><newline>Identifica el problema y usa limpieza, aerosol, nutrientes o reparación compatibles. Las penalizaciones son graduales."
    page_6: "<dark_green><bold>6. Cosechar</bold></dark_green><newline><newline>El momento va de Demasiado pronto a Pasada. La ventana marcada ofrece mejor peso y calidad y crea un lote firmado."
    page_7: "<dark_green><bold>7. Secar</bold></dark_green><newline><newline>Carga un lote fresco en un secadero limpio. Retíralo en Listo; esperar demasiado puede arruinarlo."
    page_8: "<dark_green><bold>8. Madurar</bold></dark_green><newline><newline>La maduración opcional puede mejorar calidad, valor y estabilidad, pero el abandono puede degradar el lote."
    page_9: "<dark_green><bold>9. Calidad</bold></dark_green><newline><newline>La clase combina genética, cuidados, salud, cosecha, limpieza, procesado, habilidades, trabajadores y contaminación."
    page_10: "<dark_green><bold>10. Moler</bold></dark_green><newline><newline>El Molinillo transforma un lote seco o madurado. Su estado influye en las pérdidas y se conserva el origen."
    page_11: "<dark_green><bold>11. Mezclar</bold></dark_green><newline><newline>Combina lotes molidos con proporciones exactas que suman 100 %. La mezcla registra todas las entradas."
    page_12: "<dark_green><bold>12. Enrollar</bold></dark_green><newline><newline>Usa papel, filtro y producto. Sigue el orden y las zonas de tiempo del minijuego."
    page_13: "<dark_green><bold>13. Vender</bold></dark_green><newline><newline>Solo se compran lotes auténticos. Variedad, clase, frescura, demanda, reputación y límites fijan el precio."
    page_14: "<dark_green><bold>14. Crear plantación</bold></dark_green><newline><newline>Marca dos esquinas y usa la Mesa de gestión. Las regiones no pueden solaparse."
    page_15: "<dark_green><bold>15. Contratar</bold></dark_green><newline><newline>Sube un herbolario a Experto Verdant, consigue un contrato y proporciona cama, puesto, camino, comida y salario."
    page_16: "<dark_green><bold>16. Personal y salarios</bold></dark_green><newline><newline>Los trabajadores siguen horarios y reservan tareas. El pago, descanso, seguridad, herramientas y carga determinan la moral."
  plant_health:
    title: "Salud y cuidados"
    author: "VerdantVice"
    page_1: "<green><bold>Leer la estación</bold></green><newline><newline>Salud, hidratación, nutrición, luz, estrés y limpieza son medidores del juego; el escáner añade precisión."
    page_2: "<green><bold>Equilibrio</bold></green><newline><newline>Cada variedad ficticia tiene preferencias. Mantén los valores cerca de los intervalos mostrados."
    page_3: "<green><bold>Problemas y recuperación</bold></green><newline><newline>Limpia, repara y trata solo problemas compatibles. Curar detiene nuevas pérdidas, pero no siempre restaura el potencial."
  strain_guide:
    title: "Guía de variedades"
    author: "VerdantVice"
    page_1: "<light_purple><bold>Variedades ficticias</bold></light_purple><newline><newline>Rareza, duración, dificultad, rendimiento, resistencia, agua, luz y estrés definen la jugabilidad."
    page_2: "<light_purple><bold>Atributos</bold></light_purple><newline><newline>Los valores base describen una semilla media; el perfil genético los modifica."
    page_3: "<light_purple><bold>Descubrimientos y líneas</bold></light_purple><newline><newline>Los efectos se descubren jugando. Los cruces guardan progenitores, generación, rasgos, colores y estabilidad."
  drying_curing:
    title: "Secado y maduración"
    author: "VerdantVice"
    page_1: "<gold><bold>Preparación</bold></gold><newline><newline>Revisa capacidad, limpieza, estado, estabilidad y velocidad antes de cargar."
    page_2: "<gold><bold>Fases temporales</bold></gold><newline><newline>Fresco avanza hasta Listo según marcas de tiempo, incluso sin chunk si está habilitado."
    page_3: "<gold><bold>Momento y mejora</bold></gold><newline><newline>Listo es la retirada segura. La maduración da una bonificación limitada, pero el abandono la revierte."
  advanced_genetics:
    title: "Genética avanzada"
    author: "VerdantVice"
    page_1: "<aqua><bold>Clases</bold></aqua><newline><newline>Las clases resumen siete modificadores independientes, desde Dañada hasta Legendaria."
    page_2: "<aqua><bold>Cruces</bold></aqua><newline><newline>El juego combina rasgos ponderados, aplica variación y registra ambos progenitores."
    page_3: "<aqua><bold>Estabilidad y nombres</bold></aqua><newline><newline>La estabilidad reduce variación. Los nombres se filtran y no alteran rasgos firmados."
  farm_management:
    title: "Gestión de la plantación"
    author: "VerdantVice"
    page_1: "<dark_green><bold>Región y funciones</bold></dark_green><newline><newline>Da a cada miembro solo los permisos que necesita."
    page_2: "<dark_green><bold>Almacenes y prioridades</bold></dark_green><newline><newline>Vincula cofres por tipo, prioriza plantas en peligro y protege semillas raras."
