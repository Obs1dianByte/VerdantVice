commands:
  root: { description: "Abre VerdantVice o muestra la ayuda.", usage: "/vv [subcomando]" }
  help: { description: "Muestra los comandos disponibles.", usage: "/vv help [página]" }
  guide: { description: "Abre la guía del juego.", usage: "/vv guide" }
  profile: { description: "Muestra un perfil de VerdantVice.", usage: "/vv profile [jugador]" }
  skills: { description: "Abre los cuatro árboles de habilidades.", usage: "/vv skills" }
  strains: { description: "Consulta variedades ficticias descubiertas.", usage: "/vv strains [variedad]" }
