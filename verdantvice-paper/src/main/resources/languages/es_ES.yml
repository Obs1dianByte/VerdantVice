  language: { description: "Elige un idioma compatible.", usage: "/vv language <pl_PL|en_US|de_DE|es_ES|cs_CZ|uk_UA>" }
  notifications: { description: "Configura temas y canales de avisos.", usage: "/vv notifications" }
  resourcepack: { description: "Solicita el paquete de recursos opcional.", usage: "/vv resourcepack" }
  genetics: { description: "Crea una linea propia con dos semillas firmadas.", usage: "/vv genetics <nombre>" }
  admin:
    description: "Herramientas administrativas de VerdantVice."
    usage: "/vv admin <subcomando>"
    reload: { description: "Recarga ajustes y catálogos seguros.", usage: "/vv admin reload" }
    save: { description: "Guarda los datos pendientes.", usage: "/vv admin save" }
    give: { description: "Entrega un objeto personalizado registrado.", usage: "/vv admin give <jugador> <objeto> [cantidad]" }
