book:
  basics:
    title: "Základy VerdantVice"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Semena</bold></dark_green><newline><newline>Najdi ověřeného bylinkáře. Vyšší úrovně nabízí vzácnější fiktivní odrůdy; každé semeno má podpis a genetiku."
    page_2: "<dark_green><bold>2. Sázení</bold></dark_green><newline><newline>Umísti květináč s oprávněním a použij platné semeno. Kontrolují se limity, odstup a region."
    page_3: "<dark_green><bold>3. Kontrola</bold></dark_green><newline><newline>Prázdná ruka ukáže souhrn, skener údaje podle dovednosti a knih."
    page_4: "<dark_green><bold>4. Zálivka</bold></dark_green><newline><newline>Zálivka je fiktivní ukazatel; škodí její nedostatek i přebytek."
    page_5: "<dark_green><bold>5. Problémy</bold></dark_green><newline><newline>Použij správné čištění, léčbu, výživu nebo opravu. Postihy rostou postupně."
    page_6: "<dark_green><bold>6. Sklizeň</bold></dark_green><newline><newline>Vybrané okno dává nejlepší hmotnost a kvalitu a vytvoří podepsanou várku."
    page_7: "<dark_green><bold>7. Sušení</bold></dark_green><newline><newline>Čerstvou várku vlož do čistého sušáku a vyjmi ve fázi Hotová. Běžná cesta prodeje je: sklizeň → čerstvá várka → sušák → suchá várka → prodej bylinkáři."
    page_8: "<dark_green><bold>8. Zrání</bold></dark_green><newline><newline>Volitelné zrání může zlepšit kvalitu, ale zanedbání ji sníží."
    page_9: "<dark_green><bold>9. Kvalita</bold></dark_green><newline><newline>Kvalitu tvoří genetika, péče, sklizeň, čistota, zpracování, dovednosti a kontaminace."
    page_10: "<dark_green><bold>10. Drcení</bold></dark_green><newline><newline>Drtič zpracuje suchou várku a zachová její původ."
    page_11: "<dark_green><bold>11. Míchání</bold></dark_green><newline><newline>Směšuj várky v přesných poměrech se součtem 100 %."
    page_12: "<dark_green><bold>12. Balení</bold></dark_green><newline><newline>Použij papír, filtr a produkt a dodrž pořadí minihry."
    page_13: "<dark_green><bold>13. Prodej</bold></dark_green><newline><newline>Prodávat lze jen pravé várky; cenu určuje kvalita, poptávka a pověst."
    page_14: "<dark_green><bold>14. Farma</bold></dark_green><newline><newline>Označ dva rohy a použij stůl správce. Regiony se nesmí překrývat."
    page_15: "<dark_green><bold>15. Najímání</bold></dark_green><newline><newline>Vytrénuj Experta Verdant, získej smlouvu a připrav lůžko, cestu, jídlo a mzdu."
    page_16: "<dark_green><bold>16. Práce a mzdy</bold></dark_green><newline><newline>Pracovníci plní rozvrh; mzda, odpočinek, bezpečí a zátěž určují morálku."
  plant_health: { title: "Zdraví a péče", author: "VerdantVice", page_1: "<green><bold>Ukazatele</bold></green><newline><newline>Zdraví, zálivka, výživa, světlo, stres a čistota jsou herní hodnoty.", page_2: "<green><bold>Rovnováha</bold></green><newline><newline>Každá odrůda má jiné preference; drž hodnoty v rozsahu skeneru.", page_3: "<green><bold>Obnova</bold></green><newline><newline>Čisti, opravuj a léč správný problém. Ztracený potenciál se nemusí vrátit." }
  strain_guide: { title: "Průvodce odrůdami", author: "VerdantVice", page_1: "<light_purple><bold>Odrůdy</bold></light_purple><newline><newline>Vzácnost, růst, výnos, odolnost, voda, světlo a stres tvoří herní styl.", page_2: "<light_purple><bold>Rysy</bold></light_purple><newline><newline>Základní hodnoty mění genetický profil semena.", page_3: "<light_purple><bold>Linie</bold></light_purple><newline><newline>Křížení ukládá rodiče, generaci, rysy, barvy a stabilitu." }
  drying_curing: { title: "Sušení a zrání", author: "VerdantVice", page_1: "<gold><bold>Příprava</bold></gold><newline><newline>Zkontroluj kapacitu, čistotu a stav zařízení.", page_2: "<gold><bold>Čas</bold></gold><newline><newline>Fáze postupují podle časových značek, volitelně i bez chunku.", page_3: "<gold><bold>Výsledek</bold></gold><newline><newline>Hotová je bezpečná fáze; prodlení ničí a správné zrání zlepšuje." }
  advanced_genetics: { title: "Pokročilá genetika", author: "VerdantVice", page_1: "<aqua><bold>Třídy</bold></aqua><newline><newline>Třída shrnuje sedm nezávislých modifikátorů.", page_2: "<aqua><bold>Křížení</bold></aqua><newline><newline>Hra váží rysy, přidá odchylku a uloží rodiče.", page_3: "<aqua><bold>Stabilita</bold></aqua><newline><newline>Stabilita omezuje náhodu; filtrovaný název nemění podepsané rysy." }
  farm_management: { title: "Správa farmy", author: "VerdantVice", page_1: "<dark_green><bold>Role</bold></dark_green><newline><newline>Členům dej jen potřebná oprávnění.", page_2: "<dark_green><bold>Sklady</bold></dark_green><newline><newline>Propojuj truhly podle typu a chraň vzácná semena.", page_3: "<dark_green><bold>Lidé</bold></dark_green><newline><newline>Lůžko, jídlo, cesta, odpočinek a mzda udržují morálku." }
  perfect_batch: { title: "Tajemství dokonalé várky", author: "VerdantVice", page_1: "<yellow><bold>Bez zkratky</bold></yellow><newline><newline>Genetika nevymaže špatnou péči ani kontaminaci.", page_2: "<yellow><bold>Potenciál</bold></yellow><newline><newline>Udržuj zdraví a čistotu a sklízej ve správném okně.", page_3: "<yellow><bold>Dohledatelnost</bold></yellow><newline><newline>Každá změna ukládá ztrátu a původ; kopie lore kvalitu nezmění." }
