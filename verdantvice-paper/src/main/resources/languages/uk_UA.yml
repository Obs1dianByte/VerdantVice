    setquality: { description: "Змінює якість партії.", usage: "/vv admin setquality <клас>" }
    spawnherbalist: { description: "Створює травника.", usage: "/vv admin spawnherbalist [рівень]" }
    hireworker: { description: "Наймає травника.", usage: "/vv admin hireworker <плантація>" }
    removeplant: { description: "Безпечно видаляє рослину.", usage: "/vv admin removeplant" }
