book:
  basics:
    title: "Основи VerdantVice"
    author: "VerdantVice"
    page_1: "<dark_green><bold>1. Насіння</bold></dark_green><newline><newline>Знайди перевіреного травника. Вищі рівні дають рідкісні вигадані сорти; насіння має підпис і генетику."
    page_2: "<dark_green><bold>2. Посадка</bold></dark_green><newline><newline>Постав горщик із дозволом і використай чинне насіння. Перевіряються ліміти, відстань і регіон."
    page_3: "<dark_green><bold>3. Огляд</bold></dark_green><newline><newline>Порожня рука дає підсумок, сканер — дані за навичкою й книгами."
    page_4: "<dark_green><bold>4. Полив</bold></dark_green><newline><newline>Зволоження — вигаданий показник; шкодять нестача й надлишок."
    page_5: "<dark_green><bold>5. Проблеми</bold></dark_green><newline><newline>Застосуй правильне чищення, лікування, живлення або ремонт. Штрафи зростають поступово."
    page_6: "<dark_green><bold>6. Збір</bold></dark_green><newline><newline>Найкраще вікно дає масу та якість і створює підписану партію."
    page_7: "<dark_green><bold>7. Сушіння</bold></dark_green><newline><newline>Поклади свіжу партію в чисту сушарку й дістань на стадії Готова."
    page_8: "<dark_green><bold>8. Витримка</bold></dark_green><newline><newline>Додаткова витримка поліпшує якість, але занедбання її знижує."
    page_9: "<dark_green><bold>9. Якість</bold></dark_green><newline><newline>Якість утворюють генетика, догляд, збір, чистота, обробка, навички й забруднення."
    page_10: "<dark_green><bold>10. Подрібнення</bold></dark_green><newline><newline>Подрібнювач обробляє суху партію та зберігає походження."
    page_11: "<dark_green><bold>11. Змішування</bold></dark_green><newline><newline>Змішуй партії в точних частках із сумою 100 %."
    page_12: "<dark_green><bold>12. Згортання</bold></dark_green><newline><newline>Використай папір, фільтр і продукт та дотримуйся порядку мінігри."
    page_13: "<dark_green><bold>13. Продаж</bold></dark_green><newline><newline>Продаються лише справжні партії; ціну визначають якість, попит і репутація."
    page_14: "<dark_green><bold>14. Плантація</bold></dark_green><newline><newline>Познач два кути й використай стіл керування. Регіони не перетинаються."
    page_15: "<dark_green><bold>15. Найм</bold></dark_green><newline><newline>Розвинь Експерта Verdant, отримай контракт і підготуй ліжко, шлях, їжу та зарплату."
    page_16: "<dark_green><bold>16. Праця й зарплата</bold></dark_green><newline><newline>Працівники мають графік; виплата, відпочинок, безпека й навантаження визначають мораль."
  plant_health: { title: "Здоров'я та догляд", author: "VerdantVice", page_1: "<green><bold>Показники</bold></green><newline><newline>Здоров'я, вода, живлення, світло, стрес і чистота — ігрові значення.", page_2: "<green><bold>Баланс</bold></green><newline><newline>Кожен сорт має уподобання; тримай значення в межах сканера.", page_3: "<green><bold>Відновлення</bold></green><newline><newline>Чисть, ремонтуй і лікуй правильну проблему. Втрачений потенціал не завжди повертається." }
  strain_guide: { title: "Посібник сортів", author: "VerdantVice", page_1: "<light_purple><bold>Сорти</bold></light_purple><newline><newline>Рідкість, ріст, урожай, стійкість, вода, світло й стрес утворюють стиль гри.", page_2: "<light_purple><bold>Риси</bold></light_purple><newline><newline>Базові значення змінює генетичний профіль насіння.", page_3: "<light_purple><bold>Лінії</bold></light_purple><newline><newline>Схрещення зберігає батьків, покоління, риси, кольори й стабільність." }
