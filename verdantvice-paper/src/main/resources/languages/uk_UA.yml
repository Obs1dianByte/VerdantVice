  advanced_genetics: { title: "Розширена генетика", author: "VerdantVice", page_1: "<aqua><bold>Класи</bold></aqua><newline><newline>Клас підсумовує сім незалежних модифікаторів.", page_2: "<aqua><bold>Схрещення</bold></aqua><newline><newline>Гра зважує риси, додає відхилення й записує батьків.", page_3: "<aqua><bold>Стабільність</bold></aqua><newline><newline>Стабільність обмежує випадковість; назва не змінює підписані риси." }
  farm_management: { title: "Керування плантацією", author: "VerdantVice", page_1: "<dark_green><bold>Ролі</bold></dark_green><newline><newline>Давай учасникам лише потрібні дозволи.", page_2: "<dark_green><bold>Сховища</bold></dark_green><newline><newline>Прив'язуй скрині за типом і бережи рідкісне насіння.", page_3: "<dark_green><bold>Люди</bold></dark_green><newline><newline>Ліжко, їжа, шлях, відпочинок і зарплата підтримують мораль." }
